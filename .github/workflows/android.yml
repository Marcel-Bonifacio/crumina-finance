name: Android

on:
  push:
    branches: [ android ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ android, main ]
  workflow_dispatch:

# Read-only token by default. Only the release job below gets contents: write.
permissions:
  contents: read

# Actions are pinned to full commit SHAs (version in the trailing comment).
# To update, resolve the new tag with: gh api repos/<owner>/<repo>/git/ref/tags/<tag>

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Only the result of the check ('true' or 'false') is stored here, never the secret.
      # Pull requests always build an unsigned release APK.
      SIGN: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    outputs:
      signed: ${{ steps.signed.outcome == 'success' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # The default list includes the legacy 'tools' package, which current cmdline-tools no longer provide.
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.7'

      - name: Build debug APK (validates compilation)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build release APK (validates R8/minify; unsigned)
        if: ${{ env.SIGN != 'true' }}
        run: gradle assembleRelease --no-daemon --stacktrace

      # The signing secrets exist only in this step's environment. The base64 keystore is
      # removed from the environment before Gradle starts; Gradle reads the file path and passwords.
      - name: Build signed release APK
        id: signed
        if: ${{ env.SIGN == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/crumina-release.jks"
          unset ANDROID_KEYSTORE_BASE64
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/crumina-release.jks"
          gradle assembleRelease --no-daemon --stacktrace

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/crumina-release.jks"

      - name: Upload APKs (CI artifact)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crumina-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  # On a version tag (vX.Y.Z) push, publish the signed release APK as a GitHub Release asset.
  # This job runs no Gradle code and no third-party actions, and it never sees the signing secrets.
  release:
    needs: build
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.signed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: crumina-apk
          path: apk

      - name: Publish signed APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Refusing to release unexpected tag name" >&2; exit 1; }
          SRC="https://github.com/$GITHUB_REPOSITORY"
          NOTES="Crumina $TAG for Android. This signed APK was built by GitHub Actions from the source code at tag $TAG. Download the .apk file and sideload it to install.

          Crumina is free software under the GNU Affero General Public License v3.0 and comes with no warranty.
          Source code for this build: $SRC/tree/$TAG (also attached below as the Source code archives).
          Licence: $SRC/blob/$TAG/LICENSE
          The APK also contains third-party libraries under their own licences, including the proprietary Google ML Kit. See $SRC/blob/$TAG/THIRD_PARTY_NOTICES.md"
          cp apk/release/app-release.apk "$RUNNER_TEMP/crumina-$TAG.apk"
          gh release create "$TAG" "$RUNNER_TEMP/crumina-$TAG.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Crumina $TAG (Android)" \
            --notes "$NOTES" \
            --prerelease
